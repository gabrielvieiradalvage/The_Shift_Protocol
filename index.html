<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta charset="utf-8"/>

        <!-- Desativar Cache -->
        <meta http-equiv="pragma" content="no-cache"/>

        <title>the shit potocol</title>

        <style>
            * {
                box-sizing: border-box;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }

            html, body {
                background: #1b242e; /* Azul acinzentado escuro */
                color: #d1d8e0;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Container centralizado para manter integridade de escala */
            #gm4html5_div_id {
                position: relative;
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            /* Mantém proporção e corrige o cálculo do clique/toque no mobile */
            canvas#canvas {
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                aspect-ratio: 1366 / 768;
                object-fit: contain;
                display: block;
                touch-action: none; /* Impede zoom/scroll do navegador que quebra o clique */
                image-rendering: optimizeSpeed;
                -webkit-interpolation-mode: nearest-neighbor;
            }

            /* Botão de Tela Cheia */
            #btn-fullscreen {
                position: fixed;
                top: 14px;
                right: 14px;
                z-index: 9999;
                background-color: #2b3947; /* Azul acinzentado médio */
                color: #e5ebf1;
                border: 1px solid #485c70;
                border-radius: 8px;
                padding: 8px 14px;
                font-family: Arial, sans-serif;
                font-size: 13px;
                font-weight: bold;
                letter-spacing: 0.5px;
                cursor: pointer;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
                transition: background-color 0.2s, transform 0.1s;
                touch-action: manipulation;
            }

            #btn-fullscreen:active {
                background-color: #3b4e61;
                transform: scale(0.95);
            }

            /* Estilos de Login padrão do GameMaker */
            div.gm4html5_login {
                padding: 20px;
                position: absolute;
                border: solid 2px #000000;
                background-color: #222d38;
                color: #00ff00;
                border-radius: 12px;
                box-shadow: #0a0d11 10px 10px 25px;
            }
            div.gm4html5_cancel_button { float: right; }
            div.gm4html5_login_button { float: left; }
            div.gm4html5_login_header { text-align: center; }
        </style>
    </head>

    <body>
        <!-- Botão Tela Cheia -->
        <button id="btn-fullscreen" onclick="toggleFullScreen()">⛶ TELA CHEIA</button>

        <div class="gm4html5_div_class" id="gm4html5_div_id">
            <canvas id="canvas" width="1366" height="768">
                <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
        </div>

        <script>
            // Lógica para alternar Tela Cheia
            function toggleFullScreen() {
                var doc = window.document;
                var docEl = doc.documentElement;

                var requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
                var cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

                if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                    if (requestFullScreen) {
                        requestFullScreen.call(docEl);
                    }
                } else {
                    if (cancelFullScreen) {
                        cancelFullScreen.call(doc);
                    }
                }
            }

            // Garante foco no canvas para registrar toques imediatos no mobile
            window.addEventListener('touchstart', function(e) {
                var canvas = document.getElementById('canvas');
                if (canvas && e.target === canvas) {
                    canvas.focus();
                }
            }, { passive: false });
        </script>

        <!-- Scripts do GameMaker -->
        <script type="text/javascript" src="html5game/Nome temporario.js?cachebust=188400618"></script>
        <script>window.onload = GameMaker_Init;</script>
    </body>
</html>
